<script>
  (function () {
    var d = document.documentElement;
    try { var t = localStorage.getItem('theme'); if (t) d.dataset.theme = t; } catch (e) {}
    try { if (window.top === window && sessionStorage.getItem('handNav') === 'on') d.classList.add('shell'); } catch (e) {}
    try {
      if (sessionStorage.getItem('viaDoor') === '1') {
        sessionStorage.removeItem('viaDoor');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('arrive');
      }
    } catch (e) {}
  })();
</script>
